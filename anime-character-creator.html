<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Character Creator Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6b9d;
            --primary-light: #ff8fb3;
            --secondary: #a78bfa;
            --accent: #34d399;
            --bg-gradient: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #a78bfa 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3748;
            --text-light: #718096;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-gradient); min-height: 100vh; color: var(--text-dark); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .preview-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .character-frame { background: white; border-radius: 20px; padding: 30px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        #characterSVG { border-radius: 10px; cursor: pointer; transition: transform 0.3s ease; max-width: 100%; height: auto; }
        #characterSVG:hover { transform: scale(1.02); }
        .action-buttons { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 12px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #c4b5fd); color: white; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(167, 139, 250, 0.4); }
        .btn-accent { background: linear-gradient(135deg, var(--accent), #6ee7b7); color: white; }
        .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(52, 211, 153, 0.4); }
        .controls-panel { width: 400px; background: var(--panel-bg); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); overflow-y: auto; max-height: calc(100vh - 40px); }
        .panel-header { text-align: center; margin-bottom: 25px; }
        .panel-header h1 { font-size: 24px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
        .panel-header p { color: var(--text-light); font-size: 14px; }
        .control-group { margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.6); border-radius: 12px; border: 1px solid rgba(0, 0, 0, 0.05); }
        .control-group h3 { font-size: 16px; color: var(--text-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .control-group h3::before { content: ''; width: 4px; height: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 2px; }
        .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 8px; }
        .option-btn { padding: 10px 6px; border: 2px solid transparent; border-radius: 8px; background: white; cursor: pointer; transition: all 0.2s ease; font-size: 11px; text-align: center; }
        .option-btn:hover { border-color: var(--primary-light); transform: translateY(-1px); }
        .option-btn.active { border-color: var(--primary); background: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(167, 139, 250, 0.15)); font-weight: 600; }
        .color-picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .color-picker-row label { flex: 1; font-size: 13px; color: var(--text-dark); }
        input[type="color"] { width: 50px; height: 35px; border: none; border-radius: 6px; cursor: pointer; background: white; }
        select { width: 100%; padding: 10px 12px; border: 2px solid rgba(0, 0, 0, 0.1); border-radius: 8px; font-size: 13px; background: white; cursor: pointer; transition: border-color 0.2s; }
        select:focus { outline: none; border-color: var(--primary); }
        .slider-control { margin-bottom: 10px; }
        .slider-control label { display: block; font-size: 13px; color: var(--text-dark); margin-bottom: 5px; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.1); outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; transition: transform 0.2s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        @media (max-width: 900px) { .container { flex-direction: column; padding: 10px; } .controls-panel { width: 100%; max-height: none; } .character-frame { width: 100%; max-width: 400px; } }
        @media (max-width: 480px) { .action-buttons { flex-direction: column; width: 100%; } .btn { width: 100%; justify-content: center; } .option-grid { grid-template-columns: repeat(2, 1fr); } }
        .notification { position: fixed; bottom: 20px; right: 20px; background: white; padding: 15px 25px; border-radius: 10px; box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 1000; }
        .notification.show { transform: translateY(0); opacity: 1; }
        .notification.success { border-left: 4px solid var(--accent); }
        .notification.info { border-left: 4px solid var(--secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="preview-section">
            <div class="character-frame">
                <svg id="characterSVG" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="randomizeCharacter()">Randomize</button>
                <button class="btn btn-secondary" onclick="saveCharacterPNG()">Save PNG</button>
                <button class="btn btn-accent" onclick="saveConfig()">Save Config</button>
                <button class="btn btn-secondary" onclick="loadConfig()">Load Config</button>
            </div>
        </div>
        <div class="controls-panel">
            <div class="panel-header">
                <h1>Anime Character Creator</h1>
                <p>Design your unique anime character!</p>
            </div>
            <div class="control-group">
                <h3>Base Features</h3>
                <div class="slider-control"><label>Skin Tone</label><input type="range" id="skinTone" min="0" max="100" value="50" oninput="updateCharacter()"></div>
                <div class="color-picker-row"><label>Custom Skin Color:</label><input type="color" id="skinColor" value="#f5d0c5" onchange="updateCharacter()"></div>
            </div>
            <div class="control-group">
                <h3>Hair Style</h3>
                <div class="option-grid" id="hairStyles">
                    <button class="option-btn active" data-style="short" onclick="setHairStyle('short')">Short</button>
                    <button class="option-btn" data-style="medium" onclick="setHairStyle('medium')">Medium</button>
                    <button class="option-btn" data-style="long" onclick="setHairStyle('long')">Long</button>
                    <button class="option-btn" data-style="ponytail" onclick="setHairStyle('ponytail')">Ponytail</button>
                    <button class="option-btn" data-style="twintails" onclick="setHairStyle('twintails')">Twintails</button>
                    <button class="option-btn" data-style="spiky" onclick="setHairStyle('spiky')">Spiky</button>
                </div>
                <div class="color-picker-row" style="margin-top: 12px;"><label>Hair Color:</label><input type="color" id="hairColor" value="#2d3748" onchange="updateCharacter()"></div>
            </div>
            <div class="control-group">
                <h3>Eye Style</h3>
                <div class="option-grid" id="eyeStyles">
                    <button class="option-btn active" data-style="round" onclick="setEyeStyle('round')">Round</button>
                    <button class="option-btn" data-style="almond" onclick="setEyeStyle('almond')">Almond</button>
                    <button class="option-btn" data-style="narrow" onclick="setEyeStyle('narrow')">Narrow</button>
                    <button class="option-btn" data-style="large" onclick="setEyeStyle('large')">Large</button>
                </div>
                <div class="color-picker-row" style="margin-top: 12px;"><label>Eye Color:</label><input type="color" id="eyeColor" value="#667eea" onchange="updateCharacter()"></div>
            </div>
            <div class="control-group">
                <h3>Outfit</h3>
                <div class="option-grid" id="outfitStyles">
                    <button class="option-btn active" data-style="casual" onclick="setOutfitStyle('casual')">Casual</button>
                    <button class="option-btn" data-style="school" onclick="setOutfitStyle('school')">School</button>
                    <button class="option-btn" data-style="formal" onclick="setOutfitStyle('formal')">Formal</button>
                    <button class="option-btn" data-style="sporty" onclick="setOutfitStyle('sporty')">Sporty</button>
                    <button class="option-btn" data-style="fantasy" onclick="setOutfitStyle('fantasy')">Fantasy</button>
                </div>
                <div class="color-picker-row" style="margin-top: 12px;"><label>Outfit Color:</label><input type="color" id="outfitColor" value="#667eea" onchange="updateCharacter()"></div>
            </div>
            <div class="control-group">
                <h3>Accessories</h3>
                <div class="option-grid" id="accessories">
                    <button class="option-btn" data-accessory="glasses" onclick="toggleAccessory('glasses')">Glasses</button>
                    <button class="option-btn" data-accessory="earrings" onclick="toggleAccessory('earrings')">Earrings</button>
                    <button class="option-btn" data-accessory="hat" onclick="toggleAccessory('hat')">Hat</button>
                    <button class="option-btn" data-accessory="necklace" onclick="toggleAccessory('necklace')">Necklace</button>
                    <button class="option-btn" data-accessory="bow" onclick="toggleAccessory('bow')">Bow</button>
                </div>
            </div>
            <div class="control-group">
                <h3>Background</h3>
                <select id="backgroundType" onchange="updateCharacter()">
                    <option value="solid">Solid Color</option>
                    <option value="gradient" selected>Gradient</option>
                    <option value="scene">Simple Scene</option>
                </select>
                <div class="color-picker-row" style="margin-top: 12px;"><label>BG Color 1:</label><input type="color" id="bgColor1" value="#e0e7ff" onchange="updateCharacter()"></div>
                <div class="color-picker-row"><label>BG Color 2:</label><input type="color" id="bgColor2" value="#f0f9ff" onchange="updateCharacter()"></div>
            </div>
        </div>
    </div>
    <div class="notification" id="notification"></div>
    <script src="character.js"></script>
</body>
</html>
